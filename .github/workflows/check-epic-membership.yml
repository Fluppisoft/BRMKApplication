name: Check Epic Games Membership
on:
  schedule:
    - cron: '*/30 * * * *'
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check-membership:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Epic Games membership and approve applications
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const EPIC_ORG = 'EpicGames';

            async function isEpicPublicMember(username) {
              try {
                await github.rest.orgs.checkPublicMembershipForUser({
                  org: EPIC_ORG,
                  username
                });
                return true;
              } catch (error) {
                if (error.status === 404) return false;
                throw error;
              }
            }

            async function approveIssue(issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  'Epic Games membership verified. Your application is being processed and you will receive a team invitation shortly.',
                  '',
                  'If you do not receive an invitation within a few minutes, please comment here.'
                ].join('\n')
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }

            async function processIssue(issue) {
              if (issue.state !== 'open') return;
              if (issue.user.type === 'Bot') return;

              const author = issue.user.login;
              const isMember = await isEpicPublicMember(author);

              if (isMember) {
                await approveIssue(issue);
                return;
              }

              if (context.eventName === 'issue_comment' &&
                  context.payload.comment.user.login === author) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: [
                    `We could not verify public Epic Games membership for @${author} yet.`,
                    '',
                    'Please complete both steps:',
                    '1. Join the Epic Games organization: https://www.unrealengine.com/en-US/ue-on-github',
                    '2. Set your Epic Games membership visibility to **public** (required for automated verification). Because of Epic Games\' large member list, the GitHub website often fails here — use this command instead (create a token at https://github.com/settings/tokens with the `read:org` scope):',
                    '',
                    '```bash',
                    `curl -X PUT -H "Authorization: Bearer YOUR_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/orgs/EpicGames/public_members/${author}`,
                    '```',
                    '',
                    'After both steps are done, comment again on this issue and we will re-check automatically.'
                  ].join('\n')
                });
              }
            }

            if (context.eventName === 'issue_comment') {
              const issue = context.payload.issue;
              if (issue.pull_request) return;
              await processIssue(issue);
              return;
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            for (const issue of openIssues) {
              if (issue.pull_request) continue;
              await processIssue(issue);
            }
