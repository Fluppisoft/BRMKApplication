name: Check Epic Games Membership
on:
  schedule:
    - cron: '*/30 * * * *'
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check-membership:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Epic Games membership and approve applications
        uses: actions/github-script@v9
        env:
          MEMBERSHIP_CHECK_TOKEN: ${{ secrets.ADD_TEAM_MEMBER_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const EPIC_ORG = 'EpicGames';
            
            if (!process.env.MEMBERSHIP_CHECK_TOKEN) {
              throw new Error('ADD_TEAM_MEMBER_TOKEN secret is required for Epic membership checks.');
            }

            // GITHUB_TOKEN cannot verify org membership in other orgs. Use a PAT instead so
            // requests are authenticated and get a much higher API rate limit than shared runner IPs.
            const membershipGithub = getOctokit(process.env.MEMBERSHIP_CHECK_TOKEN);

            async function withRateLimitRetry(fn, label) {
              const maxAttempts = 3;

              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                try {
                  return await fn();
                } catch (error) {
                  const isRateLimited = error.status === 403 &&
                    String(error.message).toLowerCase().includes('rate limit');

                  if (!isRateLimited || attempt === maxAttempts) {
                    throw error;
                  }

                  const retryAfter = Number(error.response?.headers?.['retry-after'] || 60);
                  core.warning(`${label}: rate limited, retrying in ${retryAfter}s (${attempt}/${maxAttempts})`);
                  await new Promise((resolve) => setTimeout(resolve, retryAfter * 1000));
                }
              }
            }

            async function isEpicPublicMember(username) {
              try {
                await withRateLimitRetry(
                  () => membershipGithub.rest.orgs.checkPublicMembershipForUser({
                    org: EPIC_ORG,
                    username
                  }),
                  `Epic public_members check for ${username}`
                );
                core.info(`Epic public_members check for ${username}: member`);
                return true;
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }

              const { data: orgs } = await withRateLimitRetry(
                () => membershipGithub.request('GET /users/{username}/orgs', { username }),
                `Epic user orgs fallback for ${username}`
              );
              const orgLogins = orgs.map((org) => org.login);
              core.info(`Epic user orgs fallback for ${username}: ${orgLogins.join(', ') || '(none)'}`);
              return orgs.some((org) => org.login.toLowerCase() === EPIC_ORG.toLowerCase());
            }

            async function getIssueDetails(issueNumber) {
              const { data } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              return data;
            }

            async function approveIssue(issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  'Epic Games membership verified. Your application is being processed and you will receive a team invitation shortly.',
                  '',
                  'If you do not receive an invitation within a few minutes, please comment here.'
                ].join('\n')
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }

            async function processIssue(issue, notifyOnFailure) {
              if (issue.state !== 'open') return;
              if (!issue.user || issue.user.type === 'Bot') return;

              const author = issue.user.login;
              const isMember = await isEpicPublicMember(author);

              if (isMember) {
                await approveIssue(issue);
                return;
              }

              if (notifyOnFailure) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: [
                    `We could not verify public Epic Games membership for @${author} yet.`,
                    '',
                    'Please complete both steps:',
                    '1. Join the Epic Games organization: https://www.unrealengine.com/en-US/ue-on-github',
                    '2. Set your Epic Games membership visibility to **public** (required for automated verification). Because of Epic Games\' large member list, the GitHub website often fails here — use this command instead (create a token at https://github.com/settings/tokens with the `read:org` scope):',
                    '',
                    '```bash',
                    `curl -X PUT -H "Authorization: Bearer YOUR_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/orgs/EpicGames/public_members/${author}`,
                    '```',
                    '',
                    'After both steps are done, comment again on this issue and we will re-check automatically.'
                  ].join('\n')
                });
              }
            }

            if (context.eventName === 'issue_comment') {
              const comment = context.payload.comment;
              const issue = context.payload.issue;

              if (issue.pull_request) return;
              if (comment.user.type === 'Bot') return;

              const fullIssue = await getIssueDetails(issue.number);
              const author = fullIssue.user.login;
              const notifyOnFailure = comment.user.login === author;

              await processIssue(fullIssue, notifyOnFailure);
              return;
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            for (const issue of openIssues) {
              if (issue.pull_request) continue;
              const fullIssue = await getIssueDetails(issue.number);
              await processIssue(fullIssue, false);
            }
